<script id="carsil-datos" type="application/json">"contenido.json"</script>
<script id="carsil-limpia" type="application/json">"contenido-c.json"</script>
<script>
(function(){
  var P = JSON.parse(document.getElementById('carsil-datos').textContent), Q = JSON.parse(document.getElementById('carsil-limpia').textContent), CL = "carsil-clave:Casa Elvia";
  var caja = document.querySelector('.carga'), barra = caja.querySelector('i'), pct = caja.querySelector('.pct'), formu = document.querySelector('form');
  function cargando(si){ caja.hidden = !si; formu.hidden = si; }
  // Si el contenido viene en archivo aparte (P es un nombre), se baja una sola vez mostrando el avance
  var bajadas = {};
  function bajar(D, ver){
    if (typeof D !== 'string') return Promise.resolve(D);
    if (bajadas[D]) return bajadas[D];
    return bajadas[D] = fetch(D, {cache:'no-cache'}).then(async function(r){
      if (!r.ok) throw new Error('red');
      var total = +r.headers.get('content-length') || 0, leidos = 0, partes = [], lector = r.body && r.body.getReader ? r.body.getReader() : null;
      if (!lector) return r.json();
      while (true) {
        var x = await lector.read(); if (x.done) break;
        partes.push(x.value); leidos += x.value.length;
        if (ver) { if (total) { var v = Math.min(99, Math.round(leidos * 100 / total)); barra.style.width = v + '%'; pct.textContent = 'Cargando… ' + v + '%'; }
                   else { barra.style.width = Math.min(95, 4 + leidos / 60000) + '%'; pct.textContent = 'Cargando… ' + (leidos / 1048576).toFixed(1) + ' MB'; } }
      }
      var todo = new Uint8Array(leidos), o = 0; partes.forEach(function(b){ todo.set(b, o); o += b.length; });
      if (ver) { barra.style.width = '100%'; pct.textContent = 'Preparando…'; }
      return JSON.parse(new TextDecoder().decode(todo));
    }).catch(function(e){ delete bajadas[D]; throw e; });
  }
  function bytes(b){ var s = atob(b), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  async function llaveDe(clave, w, D){
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
    var k = await crypto.subtle.deriveKey({name:'PBKDF2', salt:bytes(w.s), iterations:D.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    return crypto.subtle.decrypt({name:'AES-GCM', iv:bytes(w.i)}, k, bytes(w.c));
  }
  async function abrir(clave, D, ver){
    var limpia = !!D; D = await bajar(D || P, ver); var raw = null;
    for (var j = 0; j < D.k.length && !raw; j++) { try { raw = await llaveDe(clave, D.k[j], D); } catch(_){} }
    if (!raw) throw new Error('clave');
    var llave = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    var doc = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:bytes(D.i)}, llave, bytes(D.c)));
    if (!limpia) { try { localStorage.setItem(CL, clave); } catch(e){} }
    document.open(); document.write(doc); document.close();
  }
  // Link personal: #a-codigo entra directo y se borra de la barra de direcciones,
  // así lo que el cliente copie o comparta desde el navegador ya pide contraseña.
  var ma = /^#a-([A-Za-z0-9]+)$/.exec(location.hash || '');
  if (ma) { try { history.replaceState(null, '', location.pathname + location.search); } catch(e){} }
  var f = document.querySelector('form'), inp = document.getElementById('clave'), err = document.querySelector('.error'), btn = f.querySelector('button');
  f.addEventListener('submit', function(e){
    e.preventDefault(); btn.disabled = true; err.textContent = ''; btn.textContent = 'Abriendo…';
    abrir(inp.value.trim()).catch(function(e){ btn.textContent = 'Ver propuesta'; btn.disabled = false;
      err.textContent = (e instanceof TypeError) || (e && e.message === 'red') ? 'No se pudo descargar la propuesta. Revisa tu conexión e inténtalo de nuevo.' : 'Contraseña incorrecta. Revísala e inténtalo de nuevo.'; inp.select(); });
  });
  var g = null; try { g = localStorage.getItem(CL); } catch(e){}
  // Versión para compartir (ya pagada): #d-codigo abre la versión sin marca de agua y el código se queda en el link
  var md = /^#d-([A-Za-z0-9]+)$/.exec(location.hash || '');
  function falla(e, msg){ cargando(false); err.textContent = (e && e.message === 'red') || (e instanceof TypeError) ? 'No se pudo descargar la propuesta. Revisa tu conexión y vuelve a abrir el link.' : msg; }
  if (md && Q) { cargando(true); abrir(md[1], Q, true).catch(function(e){ falla(e, 'Este link para compartir ya no es válido. Escribe la contraseña que te dio CARSIL.'); }); }
  else if (ma) { cargando(true); abrir(ma[1], null, true).catch(function(e){ falla(e, 'Este link ya no es válido. Escribe la contraseña que te dio CARSIL.'); }); }
  else if (g) { cargando(true); abrir(g, null, true).catch(function(e){ cargando(false); if (!(e instanceof TypeError) && !(e && e.message === 'red')) { try { localStorage.removeItem(CL); } catch(_){} } }); }
  else bajar(P).catch(function(){});
})();
